<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-label="mwurch — systems and full-stack developer, trained at 42 School. Open to opportunities.">
<defs>
<linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00deeb"/><stop offset="1" stop-color="#f770ef"/></linearGradient>
<filter id="dot" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="3" height="1" fill="#ffffff" opacity="0.015"/></pattern>
<clipPath id="cardClip"><rect x="0" y="0" width="900" height="180" rx="12"/></clipPath>
<clipPath id="typeClip"><rect x="59" y="126" width="0" height="22"><animate attributeName="width" values="0;339;339;0" keyTimes="0;0.5;0.92;1" dur="7s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<g clip-path="url(#cardClip)">
<rect x="0" y="0" width="900" height="180" rx="12" fill="#070b14"/>
<rect x="0" y="0" width="900" height="46" fill="#0e101f"/>
<line x1="0" y1="46" x2="900" y2="46" stroke="#343759"/>
<circle cx="24" cy="23" r="6" fill="#ff5f56" filter="url(#dot)"/>
<circle cx="45" cy="23" r="6" fill="#ffbd2e" filter="url(#dot)"/>
<circle cx="66" cy="23" r="6" fill="#27c93f" filter="url(#dot)"/>
<text x="98" y="27" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#9d9abc" letter-spacing="0.5">~/mwurch — zsh</text>

<text x="40" y="104" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="40" font-weight="800" letter-spacing="2" fill="url(#wordmark)">mwurch</text>

<rect x="642" y="75" width="218" height="29" rx="14.5" fill="#0d1b12" stroke="#2f6b34"/>
<circle cx="663" cy="89.5" r="4.5" fill="#5ecb43"><animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/></circle>
<text x="677" y="94" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="#8fe07a" letter-spacing="0.3">Open to opportunities</text>

<text x="41" y="140" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14.5" fill="#5ecb43">$</text>
<g clip-path="url(#typeClip)"><text x="59" y="140" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14.5" fill="#5caeb2">whoami <tspan fill="#7f7c9d">→</tspan> systems &amp; full-stack developer</text></g>
<rect y="127" width="8" height="15" fill="#00deeb"><animate attributeName="x" values="59;398;398;59" keyTimes="0;0.5;0.92;1" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0.2;0.2;1" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/></rect>

<rect x="0" y="0" width="900" height="180" fill="url(#scan)"/>
</g>
<rect x="0.5" y="0.5" width="899" height="179" rx="12" fill="none" stroke="#404272"/>
</svg>
